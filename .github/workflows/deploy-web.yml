name: Deploy web app

# Runs the shared Python + TypeScript parity test suite, builds the static client-side web app,
# packages an offline zip bundle, and deploys to GitHub Pages when merged to main (#25).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Parity tests and web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies and verify parity fixture
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q tests/test_parity.py tests/test_reconcile.py tests/test_loading.py tests/test_consents.py tests/test_exports.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check desktop and web versions match
        run: |
          PY_VER=$(python -c "import sys; sys.path.insert(0, 'src'); from version import __version__; print(__version__)")
          WEB_VER=$(node -p "require('./web/package.json').version")
          if [ "$PY_VER" != "$WEB_VER" ]; then
            echo "::error::src/version.py ($PY_VER) does not match web/package.json ($WEB_VER)"
            exit 1
          fi
          echo "Both desktop and web versions are $PY_VER"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web parity and privacy test suite
        working-directory: web
        run: npm test

      - name: Build static web app and offline zip bundle
        working-directory: web
        run: npm run build

      - name: Upload offline web zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayerReconcile-web-offline-${{ github.sha }}
          path: web/dist/PlayerReconcile-web-offline.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy-pages:
    name: Publish to GitHub Pages
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

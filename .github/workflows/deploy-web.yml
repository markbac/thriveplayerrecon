name: Deploy web app

# Runs the shared Python + TypeScript parity test suite, builds the static client-side web app,
# packages an offline zip bundle, and deploys to GitHub Pages and Hostinger when merged to main (#25).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Parity tests and web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies and verify parity fixture
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q tests/test_parity.py tests/test_reconcile.py tests/test_loading.py tests/test_consents.py tests/test_exports.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check desktop and web versions match
        run: |
          PY_VER=$(python -c "import sys; sys.path.insert(0, 'src'); from version import __version__; print(__version__)")
          WEB_VER=$(node -p "require('./web/package.json').version")
          if [ "$PY_VER" != "$WEB_VER" ]; then
            echo "::error::src/version.py ($PY_VER) does not match web/package.json ($WEB_VER)"
            exit 1
          fi
          echo "Both desktop and web versions are $PY_VER"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web parity and privacy test suite
        working-directory: web
        run: npm test

      - name: Build static web app and offline zip bundle
        working-directory: web
        run: npm run build

      - name: Upload offline web zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayerReconcile-web-offline-${{ github.sha }}
          path: web/dist/PlayerReconcile-web-offline.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to Hostinger via FTP
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - << 'EOF'
          import ftplib
          import os
          import re
          import ssl

          raw_server = os.environ.get("FTP_SERVER", "").strip()
          user = os.environ.get("FTP_USERNAME", "").strip()
          password = os.environ.get("FTP_PASSWORD", "")

          if not (raw_server and user and password):
              print("Hostinger FTP secrets not configured; skipping FTP deploy.")
              raise SystemExit(0)

          # Strip any scheme (ftp://, ftps://) and extract host + optional remote path/port
          cleaned = re.sub(r"^[a-zA-Z]+://", "", raw_server).strip()
          parts = cleaned.split("/", 1)
          host_port = parts[0].strip()
          remote_subdir = parts[1].strip("/") if len(parts) > 1 else ""
          if ":" in host_port:
              host, port_s = host_port.rsplit(":", 1)
              port = int(port_s)
          else:
              host, port = host_port, 21

          print(f"Connecting to Hostinger FTP server (port {port})...")
          ftp = None
          try:
              ctx = ssl.create_default_context()
              ctx.check_hostname = False
              ctx.verify_mode = ssl.CERT_NONE
              ftps = ftplib.FTP_TLS(context=ctx, timeout=30)
              ftps.connect(host, port)
              ftps.login(user, password)
              ftps.prot_p()
              ftp = ftps
              print("Connected securely via FTPS (TLS).")
          except Exception as tls_exc:
              print(f"FTPS handshake/login note ({tls_exc}); trying standard FTP...")
              ftp = ftplib.FTP(timeout=30)
              ftp.connect(host, port)
              ftp.login(user, password)
              print("Connected via standard FTP.")

          ftp.set_pasv(True)

          def ensure_dir(rel_dir: str) -> None:
              if not rel_dir:
                  return
              cur = ""
              for seg in rel_dir.split("/"):
                  if not seg:
                      continue
                  cur = f"{cur}/{seg}" if cur else seg
                  try:
                      ftp.mkd(cur)
                  except ftplib.error_perm:
                      pass

          if remote_subdir:
              ensure_dir(remote_subdir)
              ftp.cwd(remote_subdir)

          local_root = os.path.abspath("web/dist")
          uploaded = 0
          for root, dirs, files in os.walk(local_root):
              rel_root = os.path.relpath(root, local_root).replace("\\", "/")
              if rel_root == ".":
                  rel_root = ""
              ensure_dir(rel_root)
              for fname in sorted(files):
                  local_path = os.path.join(root, fname)
                  remote_path = f"{rel_root}/{fname}" if rel_root else fname
                  with open(local_path, "rb") as fh:
                      ftp.storbinary(f"STOR {remote_path}", fh)
                  uploaded += 1
                  print(f"Uploaded: {remote_path} ({os.path.getsize(local_path)} bytes)")

          ftp.quit()
          print(f"Successfully uploaded {uploaded} files to Hostinger!")
          EOF

  deploy-pages:
    name: Publish to GitHub Pages
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
